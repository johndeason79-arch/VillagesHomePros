<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="description" content="The Villages Florida Home Services Directory - Find trusted local pros for roofing, AC repair, plumbing, electrical, pool service & more. Call now for fast quotes in The Villages, FL.">
  <title>Villages Home Pros • The Villages Florida Home Services Directory</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .star { color: #fbbf24; }
    .card { transition: all 0.3s; }
    .card:hover { transform: translateY(-4px); box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1); }
  </style>
</head>
<body class="bg-zinc-950 text-white">
  <!-- Header with single green button -->
  <nav class="bg-black p-4 sticky top-0 z-50">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <h1 class="text-3xl font-bold text-amber-400">Villages Home Pros</h1>
      <div class="text-center mt-4">
        <a href="get-listed.html" 
           class="inline-block bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-8 py-4 rounded-2xl text-lg shadow">
          Get Listed • Become Featured ($129/month)
        </a>
      </div>
    </div>
  </nav>

  <!-- Hero -->
  <section class="bg-gradient-to-r from-zinc-900 to-black py-20 text-center">
    <div class="max-w-4xl mx-auto px-4">
      <h2 class="text-5xl font-bold mb-4">Trusted Home Services in The Villages</h2>
      <p class="text-xl text-zinc-400 mb-8">Golf-cart friendly • Senior-focused • Fast response</p>
      <input id="searchInput" type="text" placeholder="Search plumbers, AC, roofers, tint, solar, pool..." 
             class="w-full max-w-md mx-auto p-4 rounded-2xl bg-zinc-800 text-white placeholder-zinc-500 focus:outline-none">
    </div>
  </section>

  <!-- Featured listings -->
  <section class="max-w-6xl mx-auto px-4 py-12">
    <h3 class="text-3xl font-bold mb-8 text-center">Featured Home Service Pros</h3>
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="prosGrid"></div>
  </section>

  <script>
    const listings = [
      { name: "Tint The Villages", category: "Home & Commercial Window Tinting", desc: "Residential windows • Commercial • Lifetime warranty • Local favorite", location: "The Villages", phone: "(352) 638-7828", rating: 5 },
      { name: "Frank Gay Services", category: "HVAC / Plumbing / Electrical", desc: "AC repair • Plumbing • Electrical • 24/7 emergency", location: "The Villages", phone: "(407) 512-8102", rating: 4.9 },
      { name: "The Village Handyman Service", category: "Handyman Services", desc: "All repairs • Painting • Drywall • Senior discounts", location: "The Villages", phone: "(352) 399-8146", rating: 4.8 },
      { name: "Advanced Pool Care", category: "Pool Service & Repair", desc: "Weekly cleaning • Repairs • Chemical service", location: "The Villages", phone: "(352) 399-8331", rating: 4.9 },
      { name: "The Solar Guys", category: "Solar Installation & Pool Heating", desc: "Solar panels • Tubular skylights • Solar pool heating", location: "The Villages", phone: "(352) 555-1122", rating: 5 },
      { name: "BugBusters Pest Control", category: "Pest Control", desc: "Monthly service • Termites • Ants • Pet-safe", location: "The Villages", phone: "(352) 555-5566", rating: 4.7 },
      { name: "Alamo AC & Heating", category: "HVAC / AC Repair", desc: "Golf cart service • Same-day repairs • 20+ years", location: "The Villages", phone: "(352) 555-0123", rating: 4.9 },
      { name: "Villages Plumbing Pros", category: "Plumbing", desc: "Emergency service • Leak detection • Senior discounts", location: "The Villages", phone: "(352) 555-0456", rating: 4.8 }
    ];

    function renderListings(filtered) {
      const grid = document.getElementById('prosGrid');
      grid.innerHTML = '';
      filtered.forEach(l => {
        const div = document.createElement('div');
        div.className = 'card bg-zinc-900 p-6 rounded-3xl';
        div.innerHTML = `
          <h4 class="text-xl font-semibold">${l.name}</h4>
          <p class="text-emerald-400">${l.category}</p>
          <p class="text-zinc-400 text-sm mt-2">${l.desc}</p>
          <p class="text-zinc-500 text-xs mt-4">${l.location}</p>
          <button onclick="window.location='tel:${l.phone}'" class="mt-6 w-full bg-yellow-400 text-black font-bold py-3 rounded-2xl">Call Now: ${l.phone}</button>
        `;
        grid.appendChild(div);
      });
    }

    renderListings(listings);

    document.getElementById('searchInput').addEventListener('input', function(e) {
      const term = e.target.value.toLowerCase();
      const filtered = listings.filter(l => 
        l.name.toLowerCase().includes(term) || l.desc.toLowerCase().includes(term)
      );
      renderListings(filtered.length ? filtered : listings);
    });
  </script>
</body>
</html>
