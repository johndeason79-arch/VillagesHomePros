    // Remove exact duplicates by phone+name
    const seen = new Set();
    const uniqueListings = listings.filter(l => {
      const key = l.name + l.phone;
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    });

    function performSearch(term) {
      if (term === undefined) term = document.getElementById('searchInput').value;
      term = term.toLowerCase().trim();
      document.getElementById('searchInput').value = term;

      if (!term) {
        updateSectionTitle("All Home Service Pros");
        renderListings(uniqueListings);
        return;
      }

      const filtered = uniqueListings.filter(l => {
        const searchable = [
          l.name, l.category, l.desc, ...(l.keywords || [])
        ].join(' ').toLowerCase();

        // Check if any word in the search term matches
        return term.split(' ').every(word => searchable.includes(word));
      });

      updateSectionTitle(filtered.length > 0 ? `Results for "${term}"` : `No results for "${term}"`);
      renderListings(filtered);
    }

    function updateSectionTitle(text) {
      document.getElementById('sectionTitle').textContent = text;
    }

    function renderListings(filtered) {
      const grid = document.getElementById('prosGrid');
      const count = document.getElementById('resultsCount');
      grid.innerHTML = '';

      if (filtered.length === 0) {
        count.textContent = '';
        grid.innerHTML = `
          <div class="col-span-3 text-center py-16">
            <p class="text-zinc-400 text-lg">No contractors found for that search.</p>
            <p class="text-zinc-500 text-sm mt-2">Try searching: AC, plumber, flooring, roofing, pest, pool, garage, solar, electric, lawn...</p>
            <button onclick="performSearch('')" class="mt-6 bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-6 py-3 rounded-2xl">
              Show All Pros
            </button>
          </div>`;
        return;
      }

      count.textContent = `Showing ${filtered.length} contractor${filtered.length !== 1 ? 's' : ''}`;

      filtered.forEach(l => {
        const stars = '★'.repeat(Math.floor(l.rating)) + (l.rating % 1 >= 0.5 ? '☆' : '');
        const div = document.createElement('div');
        div.className = 'card bg-zinc-900 p-6 rounded-3xl flex flex-col';
        div.innerHTML = `
          <div class="flex-1">
            <span class="text-xs bg-zinc-700 text-zinc-300 px-2 py-1 rounded-full">${l.category}</span>
            <h4 class="text-xl font-semibold mt-3">${l.name}</h4>
            <p class="text-amber-400 text-sm mt-1">${stars} ${l.rating}</p>
            <p class="text-zinc-400 text-sm mt-2">${l.desc}</p>
            <p class="text-zinc-500 text-xs mt-3">📍 ${l.location}</p>
          </div>
          <button onclick="window.location='tel:${l.phone}'"
            class="mt-5 w-full bg-yellow-400 hover:bg-yellow-300 text-black font-bold py-3 rounded-2xl text-sm">
            📞 Call Now: ${l.phone}
          </button>
        `;
        grid.appendChild(div);
      });
    }

    // Category quick-filter buttons
    function buildCategoryButtons() {
      const categories = [...new Set(uniqueListings.map(l => l.category))].sort();
      const container = document.getElementById('categoryButtons');
      categories.forEach(cat => {
        const btn = document.createElement('button');
        btn.textContent = cat;
        btn.className = 'text-xs bg-zinc-700 hover:bg-emerald-600 text-white px-3 py-1 rounded-full transition';
        btn.onclick = () => performSearch(cat);
        container.appendChild(btn);
      });
    }

    // Init
    buildCategoryButtons();
    renderListings(uniqueListings);

    document.getElementById('searchInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') performSearch();
    });
  </script>
</body>
</html>
